name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      # 1) uni-app 编译出 App 离线资源到 dist/build/app
      - name: Build uni-app resources
        run: npm run build:app

      # 2) 把 www 资源拷进原生工程 assets（构建复用 SDK 的 WWW 目录占用 gitignore，每次现生）
      - name: Copy www assets into android project
        run: |
          WWW_DIR="android/app/src/main/assets/apps/__UNI__74D4914/www"
          rm -rf "$WWW_DIR"
          mkdir -p "$WWW_DIR"
          cp -a dist/build/app/. "$WWW_DIR/"
          echo "Copied www assets:"
          ls -la "$WWW_DIR"

      - name: Setup Java (JDK 17 for AGP 8.7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) 从 GitHub Secret 解密 keystore 到构建默认路径
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/sporthealth.keystore
          ls -la android/app/sporthealth.keystore
        shell: bash

      # 4) gradle 编译 Release（产物默认已签名，build.gradle 读签名环境变量）
      - name: Build Release APK with Gradle
        working-directory: android
        env:
          ANDROID_HOME: $ANDROID_HOME
          KEYSTORE_PATH: app/sporthealth.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sport-health-app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error