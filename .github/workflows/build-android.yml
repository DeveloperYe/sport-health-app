name: Build Android APK

# 需要写权限才能创建/更新 GitHub Release
permissions:
  contents: write

on:
  # 每次 push 到 main 都自动构建出 APK（不限定路径，保证任何代码改动都触发）
  push:
    branches: [main]
  # 也支持在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      # 1) uni-app 编译出 App 离线资源到 dist/build/app
      - name: Build uni-app resources
        run: npm run build:app

      # 2) 把 www 资源拷进原生工程 assets（构建复用 SDK 的 WWW 目录占用 gitignore，每次现生）
      - name: Copy www assets into android project
        run: |
          WWW_DIR="android/app/src/main/assets/apps/__UNI__74D4914/www"
          rm -rf "$WWW_DIR"
          mkdir -p "$WWW_DIR"
          cp -a dist/build/app/. "$WWW_DIR/"
          echo "Copied www assets:"
          ls -la "$WWW_DIR"

      - name: Setup Java (JDK 17 for AGP 8.7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) 从 GitHub Secret 解密 keystore 到构建默认路径
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/sporthealth.keystore
          ls -la android/app/sporthealth.keystore
        shell: bash

      # 3.5) 修正 gradlew 可执行位（Windows 提交会丢 exec 权限）
      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      # 4) gradle 编译 Release（产物默认已签名，build.gradle 读签名环境变量）
      - name: Build Release APK with Gradle
        working-directory: android
        env:
          ANDROID_HOME: $ANDROID_HOME
          # 相对 app 模块目录（module 根目录是 android/app/），与解码步骤写入的路径对齐
          KEYSTORE_PATH: sporthealth.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sport-health-app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 5) 同时发布为一个 GitHub Release 测试版（pre-release），方便直接下载安装
      - name: Publish test Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          tag_name: test-${{ github.run_number }}
          name: 测试版 ${{ github.run_number }}
          prerelease: true
          body: |
            自动构建的测试版 APK（run #${{ github.run_number }}）

            - Commit: ${{ github.sha }}
            - 事件: ${{ github.event_name }}
            - 时间: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          append_body: true