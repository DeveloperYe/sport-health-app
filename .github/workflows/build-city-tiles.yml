name: Build City Tiles

# 批量切「中国每个城市」的离线底图包。
#
# 为什么按城市而不是按省：省级包对内蒙古（约 4.7GB 上界）、新疆（约 3.3GB）会超过
# Release 单文件 2GB 上限；按城市切每个包 1–30MB，天然合规，且失败只影响一个城市。
#
# 每个城市的产物：
#   Release 标签 city-<adcode>-<source>，资产 <adcode>.pmtiles
#   （固定标签的好处：重跑同一天源即覆盖同名资产，App 端下载地址稳定）
#
# 用法：
#   Actions → Build City Tiles → Run workflow
#     filter 留空 = 全部 370 个单元（耗时较长，会占满并发）
#     filter 填省级 adcode（如 370000 山东）= 只切该省下属单元，用于试点

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Protomaps 全球档案日期（日构建只保留约 5 天）'
        required: true
        default: '20261029'
      maxzoom:
        description: '最大缩放级'
        required: true
        default: '15'
      filter:
        description: '按省级 adcode 过滤（留空=全部）'
        required: false
        default: ''
      limit:
        description: '本片最多切几个（0=不限；矩阵上限 256，全量请分片）'
        required: false
        default: '0'
      offset:
        description: '起始偏移（分片用：0/120/240/360）'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      total: ${{ steps.gen.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          FILTER="${{ github.event.inputs.filter }}"
          LIMIT="${{ github.event.inputs.limit }}"
          node -e '
            const fs = require("fs");
            const { cities } = JSON.parse(fs.readFileSync("tiles/cities.json", "utf8"));
            const filter = process.env.FILTER || "";
            const limit = parseInt(process.env.LIMIT || "0", 10);
            let list = cities;
            if (filter) list = list.filter((c) =>
              c.provinceAdcode === filter || c.adcode === filter || c.province === filter
            );
            const offset = parseInt(process.env.OFFSET || "0", 10);
            // GitHub 单次 run 的矩阵上限是 256 个作业；370 个必须分片跑，
            // 否则整个 run 会在"生成矩阵"阶段直接失败（只跑 prepare，cut 根本不出现）。
            list = list.slice(offset, limit > 0 ? offset + limit : undefined);
            const include = list.map((c) => ({
              adcode: c.adcode,
              name: c.name,
              bbox: (c.bboxPadded || c.bbox).join(","),
              tiles: c.tilesZ15,
            }));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify({ include }) + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "total=" + include.length + "\n");
            console.log("待切 " + include.length + " 个城市（offset=" + (process.env.OFFSET || "0") + "）");
            for (const c of include.slice(0, 40)) console.log("  " + c.name + " " + c.adcode + " bbox=" + c.bbox);
          '
        env:
          FILTER: ${{ github.event.inputs.filter }}
          LIMIT: ${{ github.event.inputs.limit }}
          OFFSET: ${{ github.event.inputs.offset }}

  cut:
    needs: prepare
    if: needs.prepare.outputs.total != '0'
    runs-on: ubuntu-latest
    # 公开仓库免费并发 20；大省的城市多时靠这个上限控速，避免把 Protomaps 打爆
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.name }} (${{ matrix.adcode }})
    timeout-minutes: 90
    steps:
      - name: Download pmtiles CLI
        run: |
          curl -fL -o pmtiles.tar.gz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar -xzf pmtiles.tar.gz
          chmod +x pmtiles
          ./pmtiles version

      - name: Extract ${{ matrix.name }}
        run: |
          OUT="${{ matrix.adcode }}.pmtiles"
          SRC="https://build.protomaps.com/${{ github.event.inputs.source }}.pmtiles"
          echo "city=${{ matrix.name }} bbox=${{ matrix.bbox }} maxzoom=${{ github.event.inputs.maxzoom }}"
          ok=0
          for i in $(seq 1 10); do
            rm -f "$OUT"
            echo "=== attempt $i / 10 ==="
            if ./pmtiles extract "$SRC" "$OUT" \
                 --bbox="${{ matrix.bbox }}" \
                 --maxzoom=${{ github.event.inputs.maxzoom }} \
                 --download-threads=4 ; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::10 次尝试全部失败（源=$SRC bbox=${{ matrix.bbox }}）"
            exit 1
          fi
          ls -lh "$OUT"

      - name: Verify + hash
        id: verify
        run: |
          OUT="${{ matrix.adcode }}.pmtiles"
          ./pmtiles verify "$OUT"
          ./pmtiles show "$OUT" | grep -Ei 'bounds|min zoom|max zoom|addressed tiles' || true
          SIZE=$(stat -c%s "$OUT")
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "${{ matrix.adcode }} ${{ matrix.name }} $SIZE $SHA" >> city-sums.txt

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: city-${{ matrix.adcode }}-${{ github.event.inputs.source }}
          name: 城市底图 ${{ matrix.name }}（${{ matrix.adcode }}）
          prerelease: true
          body: |
            离线矢量瓦片包（Protomaps / ODbL，© OpenStreetMap contributors）

            - 城市：${{ matrix.name }}（adcode ${{ matrix.adcode }}）
            - bbox: `${{ matrix.bbox }}`
            - maxzoom: `${{ github.event.inputs.maxzoom }}`
            - source: `${{ github.event.inputs.source }}`
            - 字节数：${{ steps.verify.outputs.size }}
            - sha256：`${{ steps.verify.outputs.sha }}`
          files: ${{ matrix.adcode }}.pmtiles

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: sum-${{ matrix.adcode }}
          path: city-sums.txt
          retention-days: 7
          if-no-files-found: ignore
