apply plugin: 'com.android.application'

// 签名配置：优先读 CI 环境变量（GitHub Secrets），其次读本地 gitignore 的
// keystore.properties。两者都没有则构建失败，绝不在源码里写死密码。
def keystoreProperties = new Properties()
def keystorePropsFile = file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProperties.load(it) }
}

// 从环境变量优先，其次 keystore.properties，取不到返回 null（让其显式失败）
def cred = { String envKey, String propKey ->
    def envVal = System.getenv(envKey)
    if (envVal != null && !envVal.trim().isEmpty()) return envVal
    def propVal = keystoreProperties.getProperty(propKey)
    if (propVal != null && !propVal.trim().isEmpty()) return propVal
    return null
}

def SIGN_KEY_ALIAS      = cred('KEY_ALIAS',        'keyAlias')
def SIGN_KEY_PASSWORD   = cred('KEY_PASSWORD',     'keyPassword')
def SIGN_STORE_PASSWORD = cred('KEYSTORE_PASSWORD','storePassword')
def SIGN_KEYSTORE_PATH  = System.getenv('KEYSTORE_PATH')
        ?: keystoreProperties.getProperty('storeFile') ?: file('sporthealth.keystore').path

android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'
    namespace 'com.developerye.sporthealth'
    defaultConfig {
        applicationId "com.developerye.sporthealth"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 100
        versionName "1.0.0"
        multiDexEnabled true
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    }
    signingConfigs {
        config {
            keyAlias SIGN_KEY_ALIAS
            keyPassword SIGN_KEY_PASSWORD
            storeFile file(SIGN_KEYSTORE_PATH)
            storePassword SIGN_STORE_PASSWORD
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.config
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.config
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.core:core:1.1.0'
    implementation "androidx.fragment:fragment:1.1.0"
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.facebook.fresco:fresco:2.5.0'
    implementation "com.facebook.fresco:animated-gif:2.5.0"
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'androidx.webkit:webkit:1.5.0'
}